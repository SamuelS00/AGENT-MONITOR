[package]
name = "agent-monitor"
version = "0.1.0"
description = "Local, read-only monitor for AI coding agents"
authors = ["Agent Monitor contributors"]
edition = "2021"

[lib]
name = "agent_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# Lint policy: the monitor must stay read-only and warning-free.
# `cargo check` surfaces these warnings; CI denies them via `cargo clippy -D warnings`.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
